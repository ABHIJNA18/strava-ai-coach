<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Strava AI Coach</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <main class="container">

        <header>

            <h1>🏃 Strava AI Coach</h1>

            <p>
                Connect your Strava account and receive AI-powered running insights.
            </p>

        </header>

        <section class="card">

            <h2>Login</h2>

            <button id="login-button">
                Login with Strava
            </button>

        </section>

        <section class="card">

            <h2>AI Coach</h2>

            <button id="summary-button">
                Generate 30-Day Summary
            </button>

            <div id="summary-box">

                AI summary will appear here.

            </div>

        </section>

        <section class="card">

            <h2>Recent Activities</h2>

            <div id="activities-list">

                Activities will appear here.

            </div>

        </section>

    </main>
    <script src="js/app.js"></script>

</body>

</html>
